# Cloudflare Email Worker for supplier invoices. Setup: README.md in this folder.
name = "creafluxe-invoice-mail"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
APP_URL = "https://admin.creafluxe.be"
# Who may send to the address (comma-separated; "@domain" allows a whole domain).
# Checked against the envelope sender and the From header.
ALLOWED_FROM = "bart.helsen@creafluxe.be,contact@creafluxe.be"

# Secret, not in this file:  npx wrangler secret put PURCHASE_INBOUND_SECRET
